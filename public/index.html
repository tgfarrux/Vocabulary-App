<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lug'at daftarcham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper: #F6F1E4;
    --paper-dark: #ECE2C8;
    --paper-line: #D8CBA8;
    --ink: #24211B;
    --ink-soft: #6b6455;
    --red: #B23A2E;
    --red-soft: #c9584c;
    --gold: #C9971F;
    --green: #4F7A5D;
    --green-soft: #dbe7dd;
    --navy: #2D3A55;
    --surface: #fffdf7;
    --binder-a: #E9DFC4;
    --binder-b: #E2D6B4;
    --binder-border: #c8b98a;
    --ring-a: #fff8e8;
    --ring-b: #cbb87e;
    --ring-c: #9c8a54;
    --ring-shadow: #efe6c9;
    --tape-overlay: rgba(255,255,255,0.55);
    --card-shadow: 0 1px 0 rgba(36,33,27,0.06), 0 6px 16px -8px rgba(36,33,27,0.25);
  }
  html[data-theme="dark"]{
    --paper: #1E1B16;
    --paper-dark: #2A251E;
    --paper-line: #3A3327;
    --ink: #ECE4D3;
    --ink-soft: #a89f8a;
    --red: #E2685A;
    --red-soft: #c9584c;
    --gold: #E0B84D;
    --green: #7FAE8D;
    --green-soft: #24352a;
    --navy: #7C93C7;
    --surface: #29241D;
    --binder-a: #2b2620;
    --binder-b: #221d18;
    --binder-border: #4a4030;
    --ring-a: #4a4436;
    --ring-b: #6b5f42;
    --ring-c: #3a3225;
    --ring-shadow: #352f24;
    --tape-overlay: rgba(255,255,255,0.08);
    --card-shadow: 0 1px 0 rgba(0,0,0,0.2), 0 6px 16px -8px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 34px, var(--paper-line) 35px),
      var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    display:flex;
    max-width:1180px;
    margin:0 auto;
    min-height:100vh;
  }

  /* ---------- Spiral binder sidebar ---------- */
  .binder{
    width:64px;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--binder-a), var(--binder-b));
    border-right:2px dashed var(--binder-border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 0;
    position:relative;
    gap:22px;
  }
  .ring{
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--ring-a), var(--ring-b) 55%, var(--ring-c) 100%);
    box-shadow: inset 0 0 0 3px var(--ring-shadow), 0 1px 2px rgba(0,0,0,0.25);
    flex-shrink:0;
  }
  main{flex:1; padding:34px 40px 110px; min-width:0;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    width:calc(100% - 32px);
    max-width:420px;
    display:flex;
    align-items:stretch;
    justify-content:space-between;
    gap:4px;
    background: var(--surface);
    border: 1.5px solid var(--paper-line);
    border-radius:20px;
    padding:6px;
    box-shadow: 0 10px 25px -5px rgba(36,33,27,0.12), var(--card-shadow);
    z-index:40;
    transition: background .2s, border-color .2s;
  }
  .bn-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    background:none;
    border:none;
    border-radius:14px;
    padding:8px 4px;
    cursor:pointer;
    color: var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size:11.5px;
    font-weight:600;
    transition:background .15s, color .15s;
  }
  .bn-item:hover{color: var(--ink);}
  .bn-item.active{
    background: var(--paper-dark);
    color: var(--navy);
  }
  .bn-icon{display:flex; align-items:center; justify-content:center; height:22px;}
  .bn-emoji{font-size:19px; line-height:1;}
  .bn-avatar{
    width:22px; height:22px;
    border-radius:50%;
    overflow:hidden;
    background: var(--paper-line);
    color: var(--ink);
  }
  .bn-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .bn-item.active .bn-avatar{box-shadow:0 0 0 2px var(--navy);}

  /* ---------- Header / cover ---------- */
  .cover{margin-bottom:22px; position:relative;}
  .top-icons{
    position:absolute;
    top:0;
    right:0;
    display:flex;
    align-items:center;
    gap:20px;
  }
  .icon-group{display:flex; gap:10px;}
  .top-icon-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1.5px solid var(--paper-line);
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    cursor:pointer;
    padding:0;
    overflow:hidden;
    color:var(--ink);
    transition:transform .15s, border-color .15s;
  }
  .top-icon-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
  .top-icon-btn img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
  .avatar-fallback{display:flex; align-items:center; justify-content:center; width:100%; height:100%;}

  /* ---------- Profile & language modals ---------- */
  .profile-modal{text-align:center;}
  .profile-avatar-big{
    width:84px;height:84px;border-radius:50%;
    object-fit:cover;
    margin:6px auto 14px;
    border:2px solid var(--paper-line);
    display:block;
  }
  .profile-avatar-big.avatar-fallback{
    display:flex; align-items:center; justify-content:center;
    font-size:34px;
    background:var(--paper-dark);
  }
  .profile-name{font-family:'Fraunces', serif; font-weight:600; font-size:19px;}
  .profile-username{color:var(--ink-soft); font-size:13.5px; margin-top:4px; font-family:'IBM Plex Mono', monospace;}
  .profile-stats{
    display:flex; justify-content:center; gap:22px;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--paper-line);
    font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft);
  }
  .profile-stats b{display:block; font-family:'Inter',sans-serif; font-size:18px; color:var(--ink); font-weight:700;}

  .lang-modal h3{font-family:'Fraunces', serif; margin:0 0 16px;}
  .lang-options{display:flex; flex-direction:column; gap:10px;}
  .lang-option{
    display:flex; align-items:center; gap:10px;
    font-family:'Inter', sans-serif; font-size:15px; font-weight:600;
    padding:12px 16px;
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    background:var(--surface);
    cursor:pointer;
    color:var(--ink);
    transition:border-color .15s;
  }
  .lang-option:hover{border-color:var(--gold);}
  .lang-option.active{border-color:var(--navy); background:var(--paper-dark);}
  .lang-option .flag{font-size:20px;}

  /* ---------- Text translator ---------- */
  .translate-modal{max-width:560px;}
  .tt-box{
    position:relative;
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    background:var(--surface);
    margin-top:14px;
  }
  .tt-box textarea{
    width:100%;
    border:none;
    background:none;
    resize:vertical;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
    padding:14px 44px 14px 14px;
    box-sizing:border-box;
    min-height:100px;
  }
  .tt-box textarea:focus{outline:none;}
  .tt-box-actions{
    position:absolute;
    top:8px; right:8px;
    display:flex; flex-direction:column; gap:4px;
  }
  .tt-translate-btn{
    display:block;
    margin:14px auto 0;
    background:var(--navy);
    color:var(--surface);
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 26px;
    border-radius:8px;
    cursor:pointer;
    transition:opacity .15s;
  }
  .tt-translate-btn:hover{opacity:0.85;}
  .tt-translate-btn:disabled{opacity:0.5; cursor:default;}
  .tt-output-box{min-height:70px;}
  .tt-output{
    padding:14px 44px 14px 14px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
    white-space:pre-wrap;
    line-height:1.5;
    min-height:48px;
  }
  .tt-output.placeholder{color:var(--ink-soft);}
  .tape{
    display:inline-block;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:34px;
    background: linear-gradient(180deg, rgba(201,151,31,0.18), rgba(201,151,31,0.18));
    padding:6px 18px 8px;
    transform:rotate(-1.2deg);
    position:relative;
    box-shadow: inset 0 -2px 0 rgba(178,58,46,0.35);
  }
  .tape::before, .tape::after{
    content:"";
    position:absolute;
    top:-6px;
    width:26px;height:14px;
    background:var(--tape-overlay);
    border:1px solid rgba(0,0,0,0.04);
  }
  .tape::before{left:-8px; transform:rotate(-8deg);}
  .tape::after{right:-8px; transform:rotate(8deg);}

  .stats{
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    gap:22px;
    flex-wrap:wrap;
  }
  .stats b{color:var(--ink); font-weight:600;}
  .stat-dot{color:var(--gold);}

  /* ---------- Lang switch row ---------- */
  .lang-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:24px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .lang-row span{
    padding:6px 12px;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    background:var(--surface);
  }
  #swapLangBtn{
    border:none;
    background:none;
    font-size:16px;
    cursor:pointer;
    color:var(--navy);
    padding:4px 8px;
    border-radius:8px;
    transition:transform .15s, background .15s;
  }
  #swapLangBtn:hover{background:var(--paper-dark);}
  #swapLangBtn.spin{transform:rotate(180deg);}

  /* ---------- Add row ---------- */
  .add-row{
    display:flex;
    gap:10px;
    margin:10px 0 8px;
  }
  .add-row input{
    flex:1;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:13px 16px;
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    background:var(--surface);
    outline:none;
    transition:border-color .15s;
    color:var(--ink);
  }
  .add-row input:focus{border-color:var(--gold);}
  .add-row button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:0 22px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .add-row button:hover{background:var(--navy);}
  .add-row button:active{transform:scale(0.97);}
  .add-row button:disabled{opacity:0.5; cursor:default;}
  .hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;}

  /* ---------- Quiz banner ---------- */
  .quiz-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--green-soft);
    border:1.5px dashed var(--green);
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:20px;
    font-size:14.5px;
    color:#2f4f3a;
  }
  .quiz-banner.hidden{display:none;}
  .quiz-banner button{
    font-family:'Inter';
    font-weight:700;
    font-size:13.5px;
    background:var(--green);
    color:#fff;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }

  /* ---------- Lists ---------- */
  .lists{display:flex; gap:28px; align-items:flex-start;}
  .col{flex:1; min-width:0;}
  .col h2{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 12px;
    padding-bottom:8px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .col h2 span{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); font-weight:400;}
  .cards{display:flex; flex-direction:column; gap:12px;}

  .card{
    background:var(--surface);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:var(--card-shadow);
    position:relative;
    overflow:hidden;
  }
  .card.pending{opacity:0.6;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .en-word{font-family:'Fraunces', serif; font-weight:600; font-size:19px;}
  .card-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    border:none; background:transparent; cursor:pointer;
    width:26px; height:26px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:14px;
    transition:background .15s, color .15s;
  }
  .icon-btn:hover{background:var(--paper-dark); color:var(--ink);}
  .icon-btn.memorize:hover{color:var(--green);}
  .icon-btn.del:hover{color:var(--red);}

  .uz-word{color:var(--red); font-weight:600; font-size:14.5px; margin-top:4px;}
  .word-meta{display:flex; align-items:center; gap:8px; margin-top:2px; flex-wrap:wrap;}
  .transcription{font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft);}
  .pos-tag{
    font-family:'Inter', sans-serif;
    font-size:11px;
    font-weight:600;
    color:var(--navy);
    background:var(--paper-dark);
    padding:2px 8px;
    border-radius:20px;
  }
  .speak-btn, .copy-btn{
    border:none;
    background:none;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:14px;
    padding:2px 4px;
    border-radius:6px;
    transition:color .15s, background .15s;
  }
  .speak-btn:hover, .copy-btn:hover{color:var(--navy); background:var(--paper-dark);}
  .copy-btn.copied{color:var(--green);}
  .example{
    font-style:italic;
    color:var(--ink-soft);
    font-size:13.5px;
    margin-top:6px;
    line-height:1.45;
    border-left:2px solid var(--gold);
    padding-left:10px;
  }
  .loading-text{font-size:13px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  .error-text{font-size:12.5px; color:var(--red); margin-top:4px;}
  .retry-link{color:var(--navy); cursor:pointer; text-decoration:underline; font-weight:600;}

  .stamp{
    position:absolute;
    top:10px; right:-6px;
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:22px;
    color:var(--green);
    border:2.5px solid var(--green);
    border-radius:8px;
    padding:1px 10px 3px;
    transform:rotate(8deg);
    opacity:0.85;
    letter-spacing:0.02em;
  }
  .empty{
    color:var(--ink-soft);
    font-size:13.5px;
    padding:20px 10px;
    text-align:center;
    border:1.5px dashed var(--paper-line);
    border-radius:10px;
  }

  /* ---------- Quiz overlay ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(36,33,27,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.hidden{display:none;}
  .quiz-modal{
    background:var(--paper);
    background-image: repeating-linear-gradient(0deg, transparent, transparent 30px, var(--paper-line) 31px);
    width:100%; max-width:520px;
    border-radius:16px;
    padding:30px 32px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    position:relative;
  }
  .quiz-modal h3{
    font-family:'Fraunces', serif;
    font-size:22px;
    margin:0 0 4px;
  }
  .quiz-progress{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .quiz-word{
    font-family:'Fraunces', serif;
    font-size:28px;
    font-weight:600;
    text-align:center;
    margin:18px 0 22px;
    padding:18px;
    background:var(--surface);
    border-radius:10px;
    border:1px solid var(--paper-line);
  }
  .quiz-options{display:flex; flex-direction:column; gap:10px;}
  .quiz-option{
    font-family:'Inter';
    font-size:14.5px;
    text-align:left;
    padding:12px 16px;
    border:1.5px solid var(--paper-line);
    background:var(--surface);
    border-radius:9px;
    cursor:pointer;
    transition:border-color .12s, background .12s;
    color:var(--ink);
  }
  .quiz-option:hover{border-color:var(--navy);}
  .quiz-option.correct{border-color:var(--green); background:var(--green-soft);}
  .quiz-option.wrong{border-color:var(--red); background:#f6e0dc;}
  .quiz-option:disabled{cursor:default;}
  .quiz-close{
    position:absolute; top:16px; right:18px;
    border:none; background:transparent; font-size:18px; cursor:pointer; color:var(--ink-soft);
  }
  .quiz-footer{margin-top:20px; display:flex; justify-content:flex-end;}
  .next-btn{
    font-family:'Inter'; font-weight:700; font-size:13.5px;
    background:var(--ink); color:var(--paper);
    border:none; padding:10px 20px; border-radius:8px; cursor:pointer;
  }
  .next-btn:disabled{opacity:0.35; cursor:default;}
  .quiz-result{text-align:center;}
  .quiz-result .big-stamp{
    font-family:'Caveat', cursive;
    font-size:52px;
    color:var(--red);
    border:4px solid var(--red);
    border-radius:14px;
    display:inline-block;
    padding:6px 26px 10px;
    transform:rotate(-4deg);
    margin:10px 0 16px;
  }
  .quiz-score{font-family:'IBM Plex Mono', monospace; font-size:15px; color:var(--ink-soft);}

  @media (max-width: 720px){
    .binder{display:none;}
    main{padding:24px 18px 100px;}
    .lists{flex-direction:column;}
    .cover{
      display:grid;
      grid-template-columns:1fr auto;
      grid-template-areas:"title icons" "stats stats";
      align-items:center;
      column-gap:10px;
      row-gap:10px;
    }
    .tape{grid-area:title; justify-self:start; font-size:16px; padding:5px 12px 6px; margin:0; transform:rotate(0deg);}
    .tape::before, .tape::after{display:none;}
    .top-icons{grid-area:icons; position:static; justify-self:end;}
    .stats{grid-area:stats;}
    .top-icon-btn{width:26px; height:26px; font-size:11px;}
    .icon-group{gap:6px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="binder">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
  </div>

  <main>
    <header class="cover">
      <div class="top-icons">
        <div class="icon-group">
          <button class="top-icon-btn" id="langSwitchBtn" title="Ilova tilini tanlash">🌐</button>
          <button class="top-icon-btn" id="themeToggleBtn" title="Tungi/kunduzgi rejim">🌙</button>
        </div>
      </div>
      <div class="tape" id="appTitle">Lug'at daftarcham</div>
      <div class="stats">
        <span><span class="stat-dot">●</span> <span id="statTotalLabel">Jami so'z</span>: <b id="statTotal">0</b></span>
        <span><span class="stat-dot">●</span> <span id="statMemorizedLabel">Yodlangan</span>: <b id="statMemorized">0</b></span>
        <span><span class="stat-dot">●</span> <span id="statReadyLabel">Testga tayyor</span>: <b id="statReady">0</b></span>
      </div>
    </header>

    <div class="lang-row">
      <span id="langFrom">Inglizcha</span>
      <button id="swapLangBtn" title="Yo'nalishni almashtirish">⇄</button>
      <span id="langTo">O'zbek</span>
    </div>
    <div class="add-row">
      <input id="wordInput" type="text" placeholder="Bilmagan inglizcha so'zingizni yozing va Enter bosing..." autocomplete="off">
      <button id="addBtn">Qo'shish</button>
    </div>
    <div class="hint" id="hintText">Har bir so'z qo'shilganda, o'zbekcha ma'nosi va namunali gap avtomatik yasaladi.</div>

    <div id="quizBanner" class="quiz-banner hidden">

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function hasCloudStorage(){
  return !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage);
}
function cloudGetItem(key){
  return new Promise((resolve, reject) => {
    window.Telegram.WebApp.CloudStorage.getItem(key, (err, value) => {
      if(err) reject(err); else resolve(value);
    });
  });
}
function cloudSetItem(key, value){
  return new Promise((resolve, reject) => {
    window.Telegram.WebApp.CloudStorage.setItem(key, value, (err, success) => {
      if(err) reject(err); else resolve(success);
    });
  });
}
function cloudGetItems(keys){
  return new Promise((resolve, reject) => {
    if(keys.length === 0){ resolve({}); return; }
    window.Telegram.WebApp.CloudStorage.getItems(keys, (err, values) => {
      if(err) reject(err); else resolve(values || {});
    });
  });
}
function cloudRemoveItem(key){
  return new Promise((resolve, reject) => {
    window.Telegram.WebApp.CloudStorage.removeItem(key, (err, success) => {
      if(err) reject(err); else resolve(success);
    });
  });
}

async function loadWords(){
  if(hasCloudStorage()){
    try{
      const idsRaw = await cloudGetItem('word_index');
      const ids = idsRaw ? JSON.parse(idsRaw) : [];
      if(ids.length === 0){ words = []; render(); return; }
      const items = await cloudGetItems(ids.map(id => 'word_' + id));
      words = ids
        .map(id => items['word_' + id] ? JSON.parse(items['word_' + id]) : null)
        .filter(Boolean);
    }catch(e){
      console.error('CloudStorage o\'qishda xato', e);
      words = [];
    }
  } else {
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      words = raw ? JSON.parse(raw) : [];
    }catch(e){
      words = [];
    }
  }
  render();
}

async function saveWords(){
  if(hasCloudStorage()){
    try{
      await cloudSetItem('word_index', JSON.stringify(words.map(w => w.id)));
      for(const w of words){
        await cloudSetItem('word_' + w.id, JSON.stringify(w));
      }
    }catch(e){
      console.error('CloudStorage yozishda xato', e);
    }
  } else {
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
    }catch(e){
      console.error('Saqlashda xatolik', e);
    }
  }
}

let currentDirection = 'en-uz';

async function fetchTranslation(word, direction){
  const response = await fetch("/api/translate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ word, direction: direction || currentDirection })
  });
  if(!response.ok){
    throw new Error('So\'rov muvaffaqiyatsiz');
  }
  const data = await response.json();
  if(!data.en || !data.uzbek || !data.example) throw new Error('Noto\'g\'ri format');
  return data;
}

async function addWord(rawInput){
  const inputWord = rawInput.trim();
  if(!inputWord) return;
  const w = { id: uid(), en: currentDirection === 'en-uz' ? inputWord : '', uz: currentDirection === 'uz-en' ? inputWord : '',
    example: '', transcription: '', partOfSpeech: '', status: 'loading', memorized: false, quizzed: false };
  words.unshift(w);
  render();
  saveWords();

  try{
    const result = await fetchTranslation(inputWord, currentDirection);
    const dupe = words.find(x => x.id !== w.id && x.en.toLowerCase() === result.en.toLowerCase());
    if(dupe){
      words = words.filter(x => x.id !== w.id);
      render();
      saveWords();
      return;
    }
    w.en = result.en;
    w.uz = result.uzbek;
    w.example = result.example;
    w.transcription = result.transcription;
    w.partOfSpeech = result.partOfSpeech;
    w.status = 'ready';
  }catch(e){
    w.status = 'error';
  }
  render();
  saveWords();
}

function toggleMemorized(id){
  const w = words.find(x => x.id === id);
  if(!w) return;
  w.memorized = !w.memorized;
  render();
  saveWords();
  checkQuizReady();
}

function deleteWord(id){
  words = words.filter(x => x.id !== id);
  render();
  saveWords();
  if(hasCloudStorage()){
    cloudRemoveItem('word_' + id).catch(e => console.error('CloudStorage\'dan o\'chirishda xato', e));
  }
}

function retryWord(id){
  const w = words.find(x => x.id === id);
  if(!w) return;
  w.status = 'loading';
  render();
  fetchTranslation(w.en || w.uz, w.en ? 'en-uz' : 'uz-en').then(result => {
    w.en = result.en;
    w.uz = result.uzbek;
    w.example = result.example;
    w.transcription = result.transcription;
    w.partOfSpeech = result.partOfSpeech;
    w.status = 'ready';
    render();
    saveWords();
  }).catch(() => {
    w.status = 'error';
    render();
  });
}

let currentAudio = null;
function speakWord(text){
  if(currentAudio){
    currentAudio.pause();
    currentAudio = null;
  }
  const audio = new Audio('/api/speak?text=' + encodeURIComponent(text));
  currentAudio = audio;
  audio.play().catch(() => {
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    }
  });
}

function copyText(text, btn){
  const done = () => {
    if(!btn) return;
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '⧉'; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => {});
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}

function checkQuizReady(){
  const ready = words.filter(w => w.memorized && !w.quizzed);
  quizBanner.classList.toggle('hidden', ready.length < 10);
}

function cardHtml(w){
  const headword = w.en || w.uz;
  if(w.status === 'loading'){
    return `<div class="card pending">
      <div class="card-top">
        <div class="en-word">${escapeHtml(headword)}</div>
        <div class="card-actions">
          <button class="icon-btn del" onclick="deleteWord('${w.id}')" title="${t('titleDelete')}">✕</button>
        </div>
      </div>
      <div class="loading-text">${t('loadingText')}</div>
    </div>`;
  }
  if(w.status === 'error'){
    return `<div class="card">
      <div class="card-top">
        <div class="en-word">${escapeHtml(headword)}</div>
        <div class="card-actions">
          <button class="icon-btn del" onclick="deleteWord('${w.id}')" title="${t('titleDelete')}">✕</button>
        </div>
      </div>
      <div class="error-text">${t('errorText')} <span class="retry-link" onclick="retryWord('${w.id}')">${t('retryLink')}</span></div>
    </div>`;
  }
  return `<div class="card">
    ${w.memorized ? `<div class="stamp">${t('stamp')}</div>` : ''}
    <div class="card-top">
      <div class="en-word">${escapeHtml(w.en)}</div>
      <div class="card-actions">
        <button class="icon-btn speak-btn" onclick="speakWord('${escapeJs(w.en)}')" title="${t('titleSpeak')}">🔊</button>
        <button class="icon-btn memorize" onclick="toggleMemorized('${w.id}')" title="${w.memorized ? t('titleUnmemorize') : t('titleMemorize')}">${w.memorized ? '↺' : '✓'}</button>
        <button class="icon-btn del" onclick="deleteWord('${w.id}')" title="${t('titleDelete')}">✕</button>
      </div>
    </div>
    <div class="word-meta">
      ${w.transcription ? `<span class="transcription">${escapeHtml(w.transcription)}</span>` : ''}
      ${w.partOfSpeech ? `<span class="pos-tag">${escapeHtml(w.partOfSpeech)}</span>` : ''}
    </div>
    <div class="uz-word">
      ${escapeHtml(w.uz)}
      <button class="copy-btn" onclick="copyText('${escapeJs(w.uz)}', this)" title="${t('titleCopy')}">⧉</button>
    </div>
    <div class="example">${escapeHtml(w.example)}</div>
  </div>`;
}

function escapeJs(s){
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const learning = words.filter(w => !w.memorized);
  const memorized = words.filter(w => w.memorized);

  learningList.innerHTML = learning.length
    ? learning.map(cardHtml).join('')
    : `<div class="empty">${t('emptyLearning')}</div>`;

  memorizedList.innerHTML = memorized.length
    ? memorized.map(cardHtml).join('')
    : `<div class="empty">${t('emptyMemorized')}</div>`;

  document.getElementById('learningCount').textContent = `(${learning.length})`;
  document.getElementById('memorizedCount').textContent = `(${memorized.length})`;
  document.getElementById('statTotal').textContent = words.length;
  document.getElementById('statMemorized').textContent = memorized.length;
  document.getElementById('statReady').textContent = words.filter(w => w.memorized && !w.quizzed).length;

  checkQuizReady();
}

  const v = wordInput.value;
  wordInput.value = '';
  addWord(v);

const langToEl = document.getElementById('langTo');

document.getElementById('startQuizBtn').addEventListener('click', openQuizIfPossible);
document.getElementById('quizClose').addEventListener('click', closeQuiz);

const FALLBACK_DISTRACTORS = ["kitob","stol","osmon","daryo","tog'","gul","quyosh","uy","yo'l","olma","non","suv","daraxt","yulduz","shahar","qishloq","mashina","oyna","eshik","bola"];

function buildQuizQuestions(){
  const pool = words.filter(w => w.memorized && !w.quizzed && w.status === 'ready').slice(0, 10);
  const allUz = words.filter(w => w.status === 'ready').map(w => w.uz);
  return pool.map(w => {
    let distractorPool = allUz.filter(u => u !== w.uz);
    let distractors = [];
    while(distractors.length < 3){
      if(distractorPool.length){
        const idx = Math.floor(Math.random() * distractorPool.length);
        const pick = distractorPool.splice(idx,1)[0];
        if(!distractors.includes(pick)) distractors.push(pick);
      } else {
        const idx = Math.floor(Math.random() * FALLBACK_DISTRACTORS.length);
        const pick = FALLBACK_DISTRACTORS[idx];
        if(!distractors.includes(pick) && pick !== w.uz) distractors.push(pick);
      }
    }
    const options = [...distractors, w.uz].sort(() => Math.random() - 0.5);
    return { id: w.id, en: w.en, correct: w.uz, options };
  });
}

function openQuizIfPossible(){
  const eligible = words.filter(w => w.memorized && !w.quizzed && w.status === 'ready');
  if(eligible.length < 10){
    quizBody.innerHTML = `<h3>${t('quizNotReadyTitle')}</h3>
      <p style="color:var(--ink-soft); font-size:14px; line-height:1.5;">
      ${t('quizNotReadyText', eligible.length)}
      </p>`;
    quizOverlay.classList.remove('hidden');
    return;
  }
  quizState = {
    questions: buildQuizQuestions(),
    index: 0,
    score: 0,
    answered: false
  };
  quizOverlay.classList.remove('hidden');
  renderQuizQuestion();
}

function closeQuiz(){
  quizOverlay.classList.add('hidden');
  quizState = null;
}

function renderQuizQuestion(){
  const q = quizState.questions[quizState.index];
  quizState.answered = false;
  quizBody.innerHTML = `
    <h3>${t('quizTitle')}</h3>
    <div class="quiz-progress">${t('quizQuestion')} ${quizState.index + 1} / ${quizState.questions.length} &nbsp;•&nbsp; ${t('quizScore')}: ${quizState.score}</div>
    <div class="quiz-word">${escapeHtml(q.en)}</div>
    <div class="quiz-options" id="quizOptions">
      ${q.options.map((opt) => `<button type="button" class="quiz-option">${escapeHtml(opt)}</button>`).join('')}
    </div>
    <div class="quiz-footer">
      <button class="next-btn" id="nextBtn" disabled>${t('quizNext')}</button>
    </div>
  `;
  const optionButtons = Array.from(document.querySelectorAll('#quizOptions .quiz-option'));
  optionButtons.forEach((btn, i) => {
    const opt = q.options[i];
    btn.addEventListener('click', () => answerQuiz(btn, opt, q.correct, optionButtons, q.options));
  });
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);
}

function answerQuiz(btn, chosen, correct, optionButtons, options){
  if(quizState.answered) return;
  quizState.answered = true;
  optionButtons.forEach((b, i) => {
    b.disabled = true;
    if(options[i] === correct) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });
  if(chosen === correct) quizState.score++;
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  quizState.index++;
  if(quizState.index >= quizState.questions.length){
    finishQuiz();
  } else {
    renderQuizQuestion();
  }
}

function finishQuiz(){
  quizState.questions.forEach(q => {
    const w = words.find(x => x.id === q.id);
    if(w) w.quizzed = true;
  });
  render();
  saveWords();
  const score = quizState.score;
  const total = quizState.questions.length;
  const pct = Math.round((score/total)*100);
  const label = pct === 100 ? t('resultExcellent') : pct >= 70 ? t('resultGreat') : pct >= 40 ? t('resultGood') : t('resultRetry');
  quizBody.innerHTML = `
    <div class="quiz-result">
      <h3>${t('quizFinished')}</h3>
      <div class="big-stamp">${label}</div>
      <div class="quiz-score">${score} / ${total} ${t('quizCorrect')} (${pct}%)</div>
      <div class="quiz-footer" style="justify-content:center; margin-top:22px;">
        <button class="next-btn" onclick="closeQuiz()">${t('quizClose')}</button>
      </div>
    </div>
  `;
}

const profileOverlay = document.getElementById('profileOverlay');
const profileClose = document.getElementById('profileClose');
const profileBody = document.getElementById('profileBody');

function getTelegramUser(){
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe){
    return window.Telegram.WebApp.initDataUnsafe.user || null;
  }
  return null;
}

function initialsOf(user){
  const a = (user.first_name || '').charAt(0);
  const b = (user.last_name || '').charAt(0);
  return (a + b).toUpperCase() || '👤';
}

function renderProfileButton(){
  const user = getTelegramUser();
  const wrap = document.getElementById('bnAvatarWrap');
  if(!wrap) return;
  if(user && user.photo_url){
    wrap.innerHTML = `<img src="${user.photo_url}" alt="">`;
  } else if(user){
    wrap.textContent = initialsOf(user);
  }
}

function openProfile(){
  const user = getTelegramUser();
  if(!user){
    profileBody.innerHTML = `<p style="text-align:center; color:var(--ink-soft);">${t('profileNoUser')}</p>`;
    profileOverlay.classList.remove('hidden');
    return;
  }
  const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ');
  const avatarHtml = user.photo_url
    ? `<img class="profile-avatar-big" src="${user.photo_url}" alt="">`
    : `<div class="profile-avatar-big avatar-fallback">${initialsOf(user)}</div>`;
  const memorizedCount = words.filter(w => w.memorized).length;
  profileBody.innerHTML = `
    <h3>${t('profileTitle')}</h3>
    ${avatarHtml}
    <div class="profile-name">${escapeHtml(fullName)}</div>
    ${user.username ? `<div class="profile-username">@${escapeHtml(user.username)}</div>` : ''}
    <div class="profile-stats">
      <span><b>${words.length}</b>${t('profileWords')}</span>
      <span><b>${memorizedCount}</b>${t('profileMemorized')}</span>
    </div>
  `;
  profileOverlay.classList.remove('hidden');
}

// ---------- Text translator ----------
let ttDirection = 'en-uz';
const translateOverlay = document.getElementById('translateOverlay');
const translateClose = document.getElementById('translateClose');
const ttFromEl = document.getElementById('ttFrom');
const ttToEl = document.getElementById('ttTo');
const ttSwapBtn = document.getElementById('ttSwapBtn');
const ttInput = document.getElementById('ttInput');
const ttOutput = document.getElementById('ttOutput');
const ttTranslateBtn = document.getElementById('ttTranslateBtn');

function updateTtLabels(){
  if(ttDirection === 'en-uz'){
    ttFromEl.textContent = t('langEnglish');
    ttToEl.textContent = t('langUzbek');
  } else {
    ttFromEl.textContent = t('langUzbek');
    ttToEl.textContent = t('langEnglish');
  }
}

function openTranslateModal(){
  updateTtLabels();
  translateOverlay.classList.remove('hidden');
}

translateClose.addEventListener('click', () => { translateOverlay.classList.add('hidden'); setActiveNav(bnHomeBtn); });
translateOverlay.addEventListener('click', (e) => { if(e.target === translateOverlay){ translateOverlay.classList.add('hidden'); setActiveNav(bnHomeBtn); } });

ttSwapBtn.addEventListener('click', () => {
  ttDirection = ttDirection === 'en-uz' ? 'uz-en' : 'en-uz';
  updateTtLabels();
  ttSwapBtn.classList.add('spin');
  setTimeout(() => ttSwapBtn.classList.remove('spin'), 200);
  const oldInput = ttInput.value;
  ttInput.value = ttOutput.textContent && !ttOutput.classList.contains('placeholder') ? ttOutput.textContent : oldInput;
  ttOutput.textContent = '';
  ttOutput.classList.add('placeholder');
});

async function runTranslateText(){
  const text = ttInput.value.trim();
  if(!text) return;
  ttTranslateBtn.disabled = true;
  ttOutput.classList.remove('placeholder');
  ttOutput.textContent = t('loadingText');
  try{
    const response = await fetch('/api/translate-text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, direction: ttDirection })
    });
    if(!response.ok) throw new Error('fail');
    const data = await response.json();
    if(!data.translation) throw new Error('empty');
    ttOutput.textContent = data.translation;
  }catch(e){
    ttOutput.textContent = t('errorText');
  }
  ttTranslateBtn.disabled = false;
}

ttTranslateBtn.addEventListener('click', runTranslateText);
ttInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
    runTranslateText();
  }
});

document.getElementById('ttInputSpeak').addEventListener('click', () => {
  if(ttInput.value.trim()) speakWord(ttInput.value.trim());
});
document.getElementById('ttOutputSpeak').addEventListener('click', () => {
  const text = ttOutput.textContent.trim();
  if(text && !ttOutput.classList.contains('placeholder')) speakWord(text);
});
document.getElementById('ttInputCopy').addEventListener('click', (e) => {
  if(ttInput.value.trim()) copyText(ttInput.value.trim(), e.currentTarget);
});
document.getElementById('ttOutputCopy').addEventListener('click', (e) => {
  const text = ttOutput.textContent.trim();
  if(text && !ttOutput.classList.contains('placeholder')) copyText(text, e.currentTarget);
});

renderProfileButton();
